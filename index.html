<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Grammar Catch & Shoot Game</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: linear-gradient(to bottom, #87ceeb, #dff6ff); touch-action: none; }
  #game { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

  /* --- UI bar --- */
  #ui {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 4px; padding: 6px 10px;
    font-size: clamp(12px, 3vw, 18px); font-weight: bold;
    background: rgba(255,255,255,0.75); z-index: 10;
  }
  #ui .stat { white-space: nowrap; }

  /* --- Question --- */
  #questionWrap {
    position: absolute;
    top: clamp(44px, 10vw, 60px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 9;
  }
  #question {
    position: relative; top: auto; left: auto; transform: none;
    background: rgba(0,0,0,0.45); color: white;
    padding: 8px 16px; border-radius: 10px;
    font-size: clamp(15px, 4.5vw, 24px); white-space: nowrap; text-align: center; max-width: 92vw; overflow: visible;
    z-index: 8; cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    user-select: none;
  }
  #question .answer-highlight {
    background: #ffeb3b;
    color: #222;
    border-radius: 4px;
    padding: 0 4px;
    font-weight: bold;
  }

  #whyBtn {
    position: relative;
    top: auto;
    left: auto;
    transform: none;
    background: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 16px;
    padding: 4px 16px;
    font-size: clamp(12px, 3vw, 15px);
    cursor: pointer;
    z-index: 9;
    white-space: nowrap;
    backdrop-filter: blur(4px);
    transition: background 0.2s, color 0.2s;
  }
  #whyBtn:hover { background: rgba(255,255,255,0.28); color: white; }

  #question.paused-style {
    background: rgba(255,200,0,0.85);
    color: #222;
    box-shadow: 0 0 0 3px #ffcc00, 0 4px 20px rgba(255,200,0,0.5);
    transform: scale(1.04);
  }
  #pauseOverlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(48px, 14vw, 90px);
    pointer-events: none; z-index: 7; opacity: 0;
    transition: opacity 0.2s;
  }
  #pauseOverlay.show { opacity: 1; }

  /* --- Words --- */
  .word {
    position: absolute; top: -60px;
    width: clamp(70px, 22vw, 120px);
    padding: clamp(6px, 2vw, 10px);
    text-align: center; background: white; border-radius: 10px;
    font-size: clamp(16px, 5vw, 24px); font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s, background-color 0.2s;
    user-select: none;
  }
  .word-correct  { background-color: #4CAF50 !important; color: white; transform: scale(1.1); opacity: 0; transition: 0.3s; }
  .word-incorrect{ background-color: #f44336 !important; color: white; opacity: 0; transition: 0.3s; }

  /* --- Arrow --- */
  .arrow { position: absolute; width: 8px; height: 15px; background: #ff4757; border-radius: 4px; z-index: 4; }

  /* --- Player --- */
  #player {
    position: absolute; bottom: clamp(70px, 18vw, 90px); left: 50%;
    transform: translateX(-50%);
    width: clamp(50px, 12vw, 80px); height: clamp(50px, 12vw, 80px);
    font-size: clamp(28px, 8vw, 44px);
    display: flex; align-items: center; justify-content: center; z-index: 5;
  }

  /* --- Mobile controls --- */
  .ctrl-btn {
    flex: 1; padding: 14px 0; border: none; border-radius: 14px;
    font-size: clamp(18px, 5vw, 26px); font-weight: bold;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; active-opacity: 0.7;
  }
  #btnSlower  { background: #e3f2fd; color: #1565c0; }
  #btnFaster  { background: #e8f5e9; color: #2e7d32; }

  /* --- Overlay effects --- */
  #dmgFlash   { position: absolute; inset: 0; background: rgba(255,0,0,0);     pointer-events: none; z-index: 15; transition: background 0.05s; }
  #dmgFlash.flash   { background: rgba(255,0,0,0.35); }
  #greenFlash { position: absolute; inset: 0; background: rgba(0,230,118,0);   pointer-events: none; z-index: 15; transition: background 0.05s; }
  #greenFlash.flash { background: rgba(0,230,118,0.28); }

  #lostLifeText { position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); font-size: clamp(32px,10vw,52px); font-weight: bold; color: #ff2222; text-shadow: 0 0 12px #fff, 0 2px 8px #000; pointer-events: none; z-index: 16; opacity: 0; transition: opacity 0.15s; }
  #lostLifeText.show { opacity: 1; }
  #comboText    { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: clamp(28px,9vw,52px); font-weight: bold; pointer-events: none; z-index: 16; opacity: 0; transition: opacity 0.15s; white-space: nowrap; }
  #comboText.show { opacity: 1; }
  #lifeGainText { position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%); font-size: clamp(28px,9vw,48px); font-weight: bold; color: #00e676; text-shadow: 0 0 16px #fff, 0 2px 8px #000; pointer-events: none; z-index: 16; opacity: 0; transition: opacity 0.15s; }
  #lifeGainText.show { opacity: 1; }
  #praiseText {
    position: absolute; left: 50%; top: 55%;
    transform: translate(-50%, -50%) scale(0.7);
    font-size: clamp(22px, 5vw, 36px);
    font-weight: bold; font-style: italic; color: white;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    pointer-events: none; z-index: 16;
    opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease;
    white-space: nowrap;
  }
  #praiseText.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* --- Game Over --- */
  #gameOver {
    position: absolute; inset: 0; background: rgba(0,0,0,0.75); color: white;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    font-size: clamp(28px, 8vw, 44px); z-index: 20; text-align: center; padding: 20px;
  }
  #gameOver button {
    margin-top: 20px; font-size: clamp(16px,4.5vw,22px);
    padding: 14px 32px; cursor: pointer; border-radius: 12px;
    border: none; background: #ff4757; color: white; font-weight: bold;
  }

  /* --- Animations --- */
  @keyframes playerHurt {
    0%   { transform: translateX(-50%) rotate(0deg) scale(1); }
    20%  { transform: translateX(calc(-50% - 10px)) rotate(-15deg) scale(1.2); }
    50%  { transform: translateX(calc(-50% + 10px)) rotate(15deg) scale(1.2); }
    80%  { transform: translateX(calc(-50% - 6px)) rotate(-8deg) scale(1.1); }
    100% { transform: translateX(-50%) rotate(0deg) scale(1); }
  }
  #player.hurt { animation: playerHurt 0.4s ease; }
  @keyframes playerCombo {
    0%   { transform: translateX(-50%) scale(1); }
    30%  { transform: translateX(-50%) scale(1.4) rotate(-8deg); }
    60%  { transform: translateX(-50%) scale(1.3) rotate(8deg); }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); }
  }
  #player.combo { animation: playerCombo 0.4s ease; }
  @keyframes playerLifeUp {
    0%   { transform: translateX(-50%) translateY(0) scale(1); }
    40%  { transform: translateX(-50%) translateY(-18px) scale(1.35); }
    70%  { transform: translateX(-50%) translateY(-10px) scale(1.2); }
    100% { transform: translateX(-50%) translateY(0) scale(1); }
  }
  #player.lifeup { animation: playerLifeUp 0.5s ease; }

  /* Show mobile controls on touch devices */
  }
</style>
</head>

function loseLife() {
  const flash = document.getElementById("dmgFlash");
  const txt   = document.getElementById("lostLifeText");
  player.textContent = "😵";
  player.classList.remove("hurt"); void player.offsetWidth; player.classList.add("hurt");
  flash.classList.add("flash"); txt.classList.add("show");
  setTimeout(() => {
    flash.classList.remove("flash"); txt.classList.remove("show");
    player.textContent = "😀"; player.classList.remove("hurt");
  }, 500);
}

/* ---------- combo effect ---------- */
function showCombo(n) {
  const txt    = document.getElementById("comboText");
  const emojis = ["🔥","⚡","💥","🌟","✨"];
  const colors = ["#ff9800","#ffeb3b","#ff5722","#e040fb","#00e5ff"];
  const idx = Math.min(Math.floor(n / 5) - 1, 4);
  txt.textContent = emojis[idx] + " COMBO x" + n + "!";
  txt.style.color = colors[idx];
  txt.style.textShadow = "0 0 16px " + colors[idx] + ", 0 2px 8px #000";
  player.classList.remove("combo"); void player.offsetWidth; player.classList.add("combo");
  txt.classList.add("show");
  setTimeout(() => { txt.classList.remove("show"); player.classList.remove("combo"); }, 2000);
}

/* ---------- life gain effect ---------- */
function showLifeGain() {
  const flash = document.getElementById("greenFlash");
  const txt   = document.getElementById("lifeGainText");
  player.textContent = "😍";
  player.classList.remove("lifeup"); void player.offsetWidth; player.classList.add("lifeup");
  flash.classList.add("flash"); txt.classList.add("show");
  setTimeout(() => {
    flash.classList.remove("flash"); txt.classList.remove("show");
    player.textContent = "😀"; player.classList.remove("lifeup");
  }, 2000);
}

/* ---------- timer ---------- */
function getPlayTime() {
  const extra  = (paused && pauseStartTime) ? (Date.now() - pauseStartTime) : 0;
  const ms     = Date.now() - gameStartTime - totalPausedMs - extra;
  const total  = Math.floor(ms / 1000);
  const m      = Math.floor(total / 60), s = total % 60;
  return m > 0 ? m + " min " + s + " sec" : s + " sec";
}

/* ---------- end game ---------- */
function winGame() {
  if (gameEnded) return;
  gameEnded = true;
  document.getElementById("winScore").textContent  = "🏆 Score: " + score;
  document.getElementById("winTime").textContent   = "⏱ Time: " + getPlayTime();
  document.getElementById("winMistakes").textContent = mistakeCount > 0 ? "❌ Mistakes: " + mistakeCount : "✨ No mistakes!";
  document.getElementById("winScreen").style.display = "flex";
}

function endGame() {
  if (gameEnded) return;
  gameEnded = true;
  document.getElementById("finalScore").textContent = "🏆 Score: " + score;
  document.getElementById("finalTime").textContent  = "⏱ Time: " + getPlayTime();
  document.getElementById("finalWhy").textContent   = "🔍 Why pressed: " + whyCount + " time" + (whyCount !== 1 ? "s" : "");
  document.getElementById("gameOver").style.display = "flex";
}

/* ---------- handle answer ---------- */
function showAnswerInQuestion(isCorrect) {
  const correct = currentQuestion.correct;
  const filled = currentQuestion.question.replace("___", `<span class="answer-highlight">${correct}</span>`);
  questionEl.innerHTML = filled;

}

function handleSelection(text, wordElement) {
  if (isAnimating) return;
  if (paused) togglePause();
  isAnimating = true;
  const isCorrect = text === currentQuestion.correct;
  if (isCorrect) {
    wordElement.classList.add("word-correct");
    score++; streak++;
    if (streak % 5 === 0) showCombo(streak);
    if (streak % 5 === 0) { lives++; livesEl.textContent = lives; showLifeGain(); }
    if (!correctSet.has(currentQuestion._idx)) {
      correctSet.add(currentQuestion._idx);
      document.getElementById("uniqueCorrect").textContent = correctSet.size;
    }
    praiseStreak++;
    if (praiseStreak % 3 === 0) showPraise();
  } else {
    wordElement.classList.add("word-incorrect");
    lives--; livesEl.textContent = lives; streak = 0; loseLife();
    mistakeCount++;
    praiseStreak = 0;
    // Schedule retry after 20 questions
    if (!retryQueue.includes(currentQuestion._idx)) {
      retryQueue.push(currentQuestion._idx);
      retryCountdown[currentQuestion._idx] = 20;
    }
  }
  showAnswerInQuestion(isCorrect);
  updateUI();
  setTimeout(() => {
    document.querySelectorAll(".word").forEach(w => w.remove());
    isAnimating = false;
    if (lives <= 0) endGame(); else newQuestion();
  }, isCorrect ? 600 : 2000);
}

/* ---------- shoot ---------- */
function shoot() {
  if (gameEnded) return;
  if (paused) togglePause();
  const arrow = document.createElement("div");
  arrow.className = "arrow";
  const pRect = player.getBoundingClientRect();
  arrow.style.left = (pRect.left + pRect.width / 2 - 4) + "px";
  arrow.style.top  = pRect.top + "px";
  game.appendChild(arrow);
  function move() {
    if (gameEnded) { arrow.remove(); return; }
    if (paused) { requestAnimationFrame(move); return; }
    let t = parseFloat(arrow.style.top);
    arrow.style.top = (t - 8) + "px";
    document.querySelectorAll(".word").forEach(word => {
      const aR = arrow.getBoundingClientRect(), wR = word.getBoundingClientRect();
      if (aR.top < wR.bottom && aR.left > wR.left && aR.right < wR.right) {
        arrow.remove(); handleSelection(word.textContent, word);
      }
    });
    if (t > 0) requestAnimationFrame(move); else arrow.remove();
  }
  move();
}

/* ---------- create word ---------- */
function createWord(text, i, total) {
  const word = document.createElement("div");
  word.className = "word";
  word.textContent = text;
  const wordW = Math.min(120, Math.max(70, window.innerWidth * 0.22));
  const step  = window.innerWidth / (total + 1);
  word.style.left = (step * (i + 1) - wordW / 2) + "px";
  word.style.width = wordW + "px";
  game.appendChild(word);
  // Mobile: tap the word directly
  word.addEventListener("touchstart", e => {
    e.stopPropagation();
    e.preventDefault();
    handleSelection(text, word);
  }, { passive: false });
  word.addEventListener("click", () => handleSelection(text, word));
  let y = -60;
  function fall() {
    if (gameEnded) return;
    if (paused || isAnimating) { requestAnimationFrame(fall); return; }
    y += 2 * globalSpeedMultiplier;
    word.style.top = y + "px";
    const wR = word.getBoundingClientRect(), pR = player.getBoundingClientRect();
    if (!(wR.bottom < pR.top || wR.top > pR.bottom || wR.left > pR.right || wR.right < pR.left)) {
      handleSelection(text, word); return;
    }
    if (word.parentElement && y < window.innerHeight) { requestAnimationFrame(fall); return; }
    if (y >= window.innerHeight) {
      word.remove();
      if (!isAnimating && text === currentQuestion.correct) {
        lives--; livesEl.textContent = lives; streak = 0; loseLife(); updateUI();
        showAnswerInQuestion(false);
        if (lives <= 0) { setTimeout(() => endGame(), 2000); return; }
      }
      if (!isAnimating && document.querySelectorAll(".word").length === 0) {
        setTimeout(() => {
                newQuestion();
        }, document.querySelector(".answer-correct, .answer-wrong") ? 800 : 0);
      }
    }
  }
  fall();
}

/* ---------- new question ---------- */
function togglePause() {
  paused = !paused;
  if (paused) pauseStartTime = Date.now();
  else {
    if (pauseStartTime) { totalPausedMs += Date.now() - pauseStartTime; pauseStartTime = null; }
    // Reset touch reference so swipe doesn't accumulate during pause
    touchStartY = 0;
  }
  updateUI();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function initQueue() {
  questionQueue = shuffle(questions.map((q, i) => i));
  document.getElementById("totalQ").textContent = questions.length;
}

function nextFromQueue() {
  // Check if any retry is due
  for (let i = 0; i < retryQueue.length; i++) {
    const idx = retryQueue[i];
    if (retryCountdown[idx] <= 0) {
      retryQueue.splice(i, 1);
      return idx;
    }
  }
  // Decrement retry countdowns
  retryQueue.forEach(idx => retryCountdown[idx]--);

  // Get next from main queue (skip already correctly done)
  while (questionQueue.length > 0) {
    const idx = questionQueue.shift();
    if (!correctSet.has(idx)) return idx;
  }

  // Main queue empty — check if any retry still pending
  if (retryQueue.length > 0) {
    const idx = retryQueue.shift();
    return idx;
  }

  return null; // all done!
}

function newQuestion() {
  totalAnswered++;
  const idx = nextFromQueue();
  if (idx === null) {
    // All questions correctly answered!
    winGame();
    return;
  }
  currentQuestion = { ...questions[idx], _idx: idx };
  lastSentence = currentQuestion.question;
  questionEl.style.whiteSpace = "nowrap";
  questionEl.textContent = currentQuestion.question;
  // If text overflows screen width, allow wrapping
  if (questionEl.scrollWidth > window.innerWidth * 0.92) {
    questionEl.style.whiteSpace = "normal";
  }
  currentQuestion.options.forEach((opt, i) => createWord(opt, i, currentQuestion.options.length));
}

/* ========== Desktop controls ========== */
document.addEventListener("mousemove", e => {
  playerX = e.clientX;
  player.style.left = playerX + "px";
});
document.addEventListener("mousedown", e => { if (e.button === 0 && !e.target.closest("#whyBtn") && !e.target.closest("#whyBtnGameOver") && !e.target.closest("#question")) shoot(); });
document.addEventListener("wheel", e => {
  if (e.deltaY < 0) globalSpeedMultiplier = Math.min(globalSpeedMultiplier + 0.2, 4);
  else              globalSpeedMultiplier = Math.max(globalSpeedMultiplier - 0.2, 0.3);
  updateUI();
});
document.addEventListener("keydown", e => {
  if (e.code === "KeyR") { location.reload(); return; }
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
});
document.addEventListener("contextmenu", e => e.preventDefault());

// Question tap = pause (works on both mobile and desktop)
questionEl.addEventListener("touchstart", e => {
  e.preventDefault();
  e.stopPropagation();
  togglePause();
}, { passive: false });
questionEl.addEventListener("mousedown", e => {
  e.stopPropagation();
  togglePause();
});

/* ========== Mobile / touch controls ========== */
let touchStartX = 0, touchStartY = 0;

game.addEventListener("touchstart", e => {
  if (e.target.closest("#gameOver")) return;
  if (e.target.closest(".word")) return;
  e.preventDefault();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY; // always reset reference on new touch
  if (!paused) {
    playerX = t.clientX;
    player.style.left = playerX + "px";
  }
}, { passive: false });

game.addEventListener("touchmove", e => {
  if (e.target.closest(".word")) return;
  e.preventDefault();
  const t = e.touches[0];
  const dy = t.clientY - touchStartY;
  const dx = t.clientX - touchStartX;

  // Horizontal drag — move player
  playerX = t.clientX;
  player.style.left = playerX + "px";

  // Vertical swipe — change speed (every 20px threshold)
  if (!paused && Math.abs(dy) > Math.abs(dx) + 10) {
    const steps = Math.floor(Math.abs(dy) / 20);
    if (steps > 0) {
      if (dy < 0) globalSpeedMultiplier = Math.max(+(globalSpeedMultiplier - steps * 0.1).toFixed(1), 0.3);
      else        globalSpeedMultiplier = Math.min(+(globalSpeedMultiplier + steps * 0.1).toFixed(1), 4);
      touchStartY = t.clientY; // reset so it doesn't keep accumulating
      updateUI();
    }
  }
}, { passive: false });





initQueue();
updateUI();
newQuestion();

// Live timer
function startTimer() {
  timerInterval = setInterval(() => {
    if (paused || gameEnded) return;
    const extra = 0;
    const ms = Date.now() - gameStartTime - totalPausedMs;
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    document.getElementById("timerUI").textContent = m + ":" + (s < 10 ? "0" : "") + s;
  }, 500);
}
startTimer();

function openWhyGoogle() {
  whyCount++;
  document.getElementById("whyCount").textContent = whyCount;
  const sentence = lastSentence || "";
  const query = encodeURIComponent("How do I know which article to use in the sentence: '" + sentence + "'");
  if (!paused) togglePause();
  window.open("https://www.google.com/search?q=" + query, "_blank");
}

document.getElementById("whyBtn").addEventListener("click", e => {
  e.stopPropagation();
  openWhyGoogle();
});
document.getElementById("whyBtn").addEventListener("touchstart", e => {
  e.stopPropagation();
  e.preventDefault();
  openWhyGoogle();
}, { passive: false });

document.getElementById("whyBtnGameOver").addEventListener("click", e => {
  e.stopPropagation();
  openWhyGoogle();
});
</script>
